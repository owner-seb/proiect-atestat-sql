<!DOCTYPE html>
<!--
  index.html - home page: the working SQL site (lessons, SQL editor, exercises).
  Styles: css/style.css. Scripts: vendor/sql-wasm.js (SQL engine) and js/main.js (page logic).
-->
<html lang="ro"> <!-- page language: Romanian -->
<head>
  <meta charset="UTF-8"> <!-- text encoding, needed for ș ț ă î â -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- fit the page to phone screens -->
  <title>SQL Playground - Învață Oracle SQL</title> <!-- text shown in the browser tab -->
  <link rel="stylesheet" href="css/style.css"> <!-- all the styles of the site -->
  <script src="vendor/sql-wasm.js"></script> <!-- SQL engine (sql.js); provides initSqlJs -->
  <script type="module" src="js/main.js"></script> <!-- page logic; runs after the page is loaded -->
</head>
<body>
  <!-- Top header bar: site title + navigation menu (same on every page) -->
  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-title">SQL Playground</h1> <!-- site title in the header -->
      <nav class="site-nav" aria-label="Meniu principal"> <!-- navigation menu -->
        <a href="index.html" aria-current="page">Acasă</a> <!-- link to the home page (current page) -->
        <a href="cum-functioneaza.html">Cum funcționează?</a> <!-- link to the "how it works" page -->
      </nav>
    </div>
  </header>

  <main>
    <!-- Introduction section -->
    <section class="card">
      <h2>Învață Oracle SQL direct în browser</h2> <!-- main heading of the home page -->
      <p>
        Lecții scurte, un editor în care rulezi interogări reale și exerciții verificate automat,
        pe o bază de date a unei școli.
      </p> <!-- short description of the site -->
      <p id="db-status" class="status">Se încarcă baza de date...</p> <!-- database status message (filled in by main.js) -->
    </section>
  </main>

  <!-- Footer (same on every page) -->
  <footer class="site-footer">
    Proiect pentru atestatul de competențe profesionale la informatică <!-- footer text -->
  </footer>
</body>
</html>
